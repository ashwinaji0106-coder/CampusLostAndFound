<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#e9f5ff;
        }

        .card{
            margin-top:50px;
            border-radius:15px;
        }

        h1{
            text-align:center;
            margin-top:30px;
            color:#0d6efd;
            font-weight:bold;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

<div class="container">

<a class="navbar-brand fw-bold" href="/">
🎓 Campus Lost & Found
</a>

<div>

<a href="/" class="btn btn-outline-light btn-sm me-2">
🏠 Home
</a>

<a href="/dashboard" class="btn btn-outline-light btn-sm me-2">
📋 Dashboard
</a>

<a href="/lost_item" class="btn btn-outline-light btn-sm me-2">
📄 Lost
</a>

<a href="/found_item" class="btn btn-outline-light btn-sm me-2">
📦 Found
</a>

<a href="/search_items" class="btn btn-outline-light btn-sm me-2">
🔍 Search
</a>

<a href="/logout" class="btn btn-light btn-sm">
🚪 Logout
</a>

</div>

</div>

</nav>
{% with messages = get_flashed_messages() %}
{% if messages %}

<div class="container mt-3">

{% for message in messages %}

<div class="alert alert-success alert-dismissible fade show">

{{ message }}

<button type="button"
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>

{% endfor %}

</div>

{% endif %}
{% endwith %}

<div class="container">

<h1>Report Lost Item</h1>

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-danger text-white text-center">
<h3>Lost Item Details</h3>
</div>

<div class="card-body">

<form action="/lost_item" method="POST" enctype="multipart/form-data">

<div class="mb-3">
<label>Item Name</label>
<input type="text" name="item_name" class="form-control" required>
</div>

<div class="mb-3">
<label>Category</label>
<input type="text" name="category" class="form-control" required>
</div>

<div class="mb-3">
<label>Location Lost</label>
<input type="text" name="location" class="form-control" required>
</div>

<div class="mb-3">
<label>Date Lost</label>
<input type="date" name="date" class="form-control" required>
</div>
<div class="mb-3">
    <label>Upload Item Image</label>
    <input type="file"
           name="image"
           class="form-control"
           accept="image/*"
           required>
</div>

<div class="mb-3">
<label>Description</label>
<textarea name="description" class="form-control" rows="4"></textarea>
</div>

<button type="submit" class="btn btn-danger w-100">
Submit Lost Item
</button>

</form>

</div>

</div>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
